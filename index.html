let quizStartTime = 0;
let timerInterval = null;

const TWO_HOURS = 2 * 60 * 60 * 1000;


/* =====================================================
QUIZ START
===================================================== */

function startQuiz(){

    userName =
    document.getElementById("userName").value.trim();

    if(userName === ""){

        alert("कृपया अपना नाम लिखें।");

        return;
    }

    currentQuestion = 0;

    selectedAnswers = [];

    quizStartTime = Date.now();

    saveQuiz();

    startTimer();

    document.getElementById("startScreen")
    .style.display = "none";

    document.getElementById("quizScreen")
    .style.display = "block";

    document.getElementById("submitScreen")
    .style.display = "none";

    document.getElementById("resultScreen")
    .style.display = "none";

    document.getElementById("reviewScreen")
    .style.display = "none";

    showQuestion();
}


/* =====================================================
SHOW QUESTION
===================================================== */

    questions[currentQuestion];

    document.getElementById("questionNumber")
    .innerText =
    "प्रश्न " +
    (currentQuestion + 1) +
    " / " +
    questions.length;

    document.getElementById("questionText")
    .innerText =
    question.q;

    const options =
    document.getElementById("options");

    options.innerHTML = "";


    question.o.forEach(function(option,index){

        const button =
        document.createElement("button");

        button.className = "option";

        button.innerText =
        String.fromCharCode(65 + index) +
        ". " +
        option;

        button.onclick = function(){

            selectAnswer(index);

        };

        options.appendChild(button);

    });
}


/* =====================================================
SELECT ANSWER
===================================================== */

function selectAnswer(index){

    /*
    एक प्रश्न में केवल एक उत्तर
    */

    if(
        selectedAnswers[currentQuestion]
        !== undefined
    ){

        return;
    }


    selectedAnswers[currentQuestion] =
    index;

    saveQuiz();


    /*
    आखिरी प्रश्न
    */

    if(
        currentQuestion ===
        questions.length - 1
    ){

        setTimeout(function(){

            document.getElementById("quizScreen")
            .style.display = "none";

            document.getElementById("submitScreen")
            .style.display = "block";

        },300);

        return;
    }


    /*
    अगला प्रश्न अपने आप
    */

    setTimeout(function(){

        currentQuestion++;

        saveQuiz();

        showQuestion();

    },300);
}


/* =====================================================
SUBMIT
===================================================== */

function submitQuiz(){

    let unanswered = [];

    for(
        let i = 0;
        i < questions.length;
        i++
    ){

        if(
            selectedAnswers[i] === undefined
        ){

            unanswered.push(i + 1);
        }
    }


    if(unanswered.length > 0){

        alert(
            "इन प्रश्नों का उत्तर बाकी है: " +
            unanswered.join(", ")
        );

        return;
    }


    finishQuiz();
}


/* =====================================================
TIMER
===================================================== */

function startTimer(){

    clearInterval(timerInterval);

    timerInterval =
    setInterval(function(){

        let remaining =
        TWO_HOURS -
        (
            Date.now() -
            quizStartTime
        );


        if(remaining <= 0){

            clearInterval(timerInterval);

            alert(
                "⏰ 2 घंटे का समय समाप्त हो गया।"
            );

            finishQuiz();

            return;
        }


        const hours =
        Math.floor(
            remaining / 3600000
        );

        const minutes =
        Math.floor(
            (remaining % 3600000) / 60000
        );

        const seconds =
        Math.floor(
            (remaining % 60000) / 1000
        );


        document.getElementById("timer")
        .innerText =
        "⏱️ समय: " +
        String(hours).padStart(2,"0") +
        ":" +
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");

    },1000);
}


/* =====================================================
FINISH QUIZ
===================================================== */

function finishQuiz(){

    clearInterval(timerInterval);

    let correct = 0;


    questions.forEach(function(question,index){

        if(
            selectedAnswers[index] ===
            question.a
        ){

            correct++;
        }

    });


    const wrong =
    questions.length - correct;


    const percentage =
    Math.round(
        correct / questions.length * 100
    );


    const date =
    new Date().toLocaleString("hi-IN");


    const result = {

        name:userName,

        correct:correct,

        wrong:wrong,

        percentage:percentage,

        answers:selectedAnswers,

        date:date

    };


    localStorage.setItem(
        "lastQuizResult",
        JSON.stringify(result)
    );


    localStorage.removeItem(
        "quizData"
    );


    document.getElementById("quizScreen")
    .style.display = "none";

    document.getElementById("submitScreen")
    .style.display = "none";

    document.getElementById("resultScreen")
    .style.display = "block";


    document.getElementById("resultName")
    .innerText =
    "नाम: " +
    userName;


    document.getElementById("correctResult")
    .innerText =
    "✅ सही उत्तर: " +
    correct +
    " / 50";


    document.getElementById("wrongResult")
    .innerText =
    "❌ गलत उत्तर: " +
    wrong +
    " / 50";


    document.getElementById("percentageResult")
    .innerText =
    "📊 प्रतिशत: " +
    percentage +
    "%";


    document.getElementById("dateResult")
    .innerText =
    "🕐 समय: " +
    date;
}


/* =====================================================
REVIEW
===================================================== */

function showReview(){

    document.getElementById("resultScreen")
    .style.display = "none";

    document.getElementById("reviewScreen")
    .style.display = "block";


    const review =
    document.getElementById("review");

    review.innerHTML = "";


    questions.forEach(function(question,index){

        const userAnswer =
        selectedAnswers[index];

        const correct =
        userAnswer === question.a;


        const box =
        document.createElement("div");

        box.className =
        "reviewBox";


        box.innerHTML =

        "<h3>प्रश्न " +
        (index + 1) +
        "</h3>" +

        "<p><b>" +
        question.q +
        "</b></p>" +

        "<p>आपका उत्तर: " +
        (
            userAnswer !== undefined
            ?
            question.o[userAnswer]
            :
            "कोई उत्तर नहीं"
        ) +
        "</p>" +

        "<p>सही उत्तर: " +
        question.o[question.a] +
        "</p>" +

        "<p>" +
        (
            correct
            ?
            "✅ सही"
            :
            "❌ गलत"
        ) +
        "</p>";


        review.appendChild(box);

    });
}


/* =====================================================
SAVE QUIZ
===================================================== */

function saveQuiz(){

    const data = {

        name:userName,

        currentQuestion:currentQuestion,

        selectedAnswers:selectedAnswers,

        quizStartTime:quizStartTime

    };


    localStorage.setItem(
        "quizData",
        JSON.stringify(data)
    );
}


/* =====================================================
LOAD SAVED QUIZ
===================================================== */

function loadQuiz(){

    const saved =
    localStorage.getItem("quizData");


    if(!saved){

        return;
    }


    try{

        const data =
        JSON.parse(saved);


        const timePassed =
        Date.now() -
        data.quizStartTime;


        if(
            timePassed > TWO_HOURS
        ){

            localStorage.removeItem(
                "quizData"
            );

            return;
        }


        userName =
        data.name;

        currentQuestion =
        data.currentQuestion;

        selectedAnswers =
        data.selectedAnswers;

        quizStartTime =
        data.quizStartTime;


        document.getElementById("startScreen")
        .style.display = "none";

        document.getElementById("quizScreen")
        .style.display = "block";


        startTimer();

        showQuestion();

    }

    catch(error){

        localStorage.removeItem(
            "quizData"
        );

    }
}


/* =====================================================
VOICE
===================================================== */

function speakText(text){

    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "आपके ब्राउज़र में आवाज़ की सुविधा उपलब्ध नहीं है।"
        );

        return;
    }


    speechSynthesis.cancel();


    const speech =
    new SpeechSynthesisUtterance(text);


    speech.lang = "hi-IN";

    speech.rate = 0.9;


    speechSynthesis.speak(speech);
}


/* =====================================================
QUESTION VOICE
===================================================== */

function speakCurrentQuestion(){

    const question =
    questions[currentQuestion];


    let text =
    question.q +
    ". विकल्प हैं। ";


    question.o.forEach(function(option,index){

        text +=
        String.fromCharCode(65 + index) +
        ". " +
        option +
        ". ";

    });


    speakText(text);
}


/* =====================================================
DOWNLOAD RESULT
===================================================== */

function downloadResult(){

    const result =
    JSON.parse(
        localStorage.getItem(
            "lastQuizResult"
        )
    );


    if(!result){

        alert(
            "Result उपलब्ध नहीं है।"
        );

        return;
    }


    const text =

    "जय माधोरा धाम\n" +

    "निर्माता: प्रियांश यादव\n\n" +

    "धार्मिक ज्ञान Quiz Result\n\n" +

    "नाम: " +
    result.name +

    "\nसही उत्तर: " +
    result.correct +
    " / 50" +

    "\nगलत उत्तर: " +
    result.wrong +
    " / 50" +

    "\nप्रतिशत: " +
    result.percentage +
    "%" +

    "\nसमय: " +
    result.date;


    const blob =
    new Blob(
        [text],
        {
            type:
            "text/plain;charset=utf-8"
        }
    );


    const url =
    URL.createObjectURL(blob);


    const a =
    document.createElement("a");


    a.href = url;


    a.download =
    "Quiz-Result-" +
    result.name +
    ".txt";


    a.click();


    URL.revokeObjectURL(url);
}


/* =====================================================
SHARE RESULT
===================================================== */

function shareResult(){

    const result =
    JSON.parse(
        localStorage.getItem(
            "lastQuizResult"
        )
    );


    if(!result){

        alert(
            "Result उपलब्ध नहीं है।"
        );

        return;
    }


    const text =

    "🙏 जय माधोरा धाम\n\n" +

    "धार्मिक ज्ञान Quiz Result\n\n" +

    "नाम: " +
    result.name +

    "\nसही उत्तर: " +
    result.correct +
    " / 50" +

    "\nगलत उत्तर: " +
    result.wrong +
    " / 50" +

    "\nप्रतिशत: " +
    result.percentage +
    "%" +

    "\n\nनिर्माता: प्रियांश यादव";


    if(navigator.share){

        navigator.share({

            title:"Quiz Result",

            text:text

        }).catch(function(){});

    }

    else{

        navigator.clipboard
        .writeText(text)
        .then(function(){

            alert(
                "Result कॉपी हो गया।"
            );

        });

    }
}


/* =====================================================
RESTART
===================================================== */

function restartQuiz(){

    clearInterval(timerInterval);


    localStorage.removeItem(
        "quizData"
    );


    localStorage.removeItem(
        "lastQuizResult"
    );


    currentQuestion = 0;

    selectedAnswers = [];

    userName = "";

    quizStartTime = 0;


    document.getElementById("userName")
    .value = "";


    document.getElementById("startScreen")
    .style.display = "block";


    document.getElementById("quizScreen")
    .style.display = "none";


    document.getElementById("submitScreen")
    .style.display = "none";


    document.getElementById("resultScreen")
    .style.display = "none";


    document.getElementById("reviewScreen")
    .style.display = "none";
}


/* =====================================================
PAGE LOAD
===================================================== */

loadQuiz();

</script>
